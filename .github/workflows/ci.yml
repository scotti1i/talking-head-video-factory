name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # 单元测试：npm test 串联全部公开版可过套件。不跑：visual-vendor（依赖上游 Video Shotcraft 源目录）、visual-library（依赖未开源的 visual-assets/evidence 客户证据帧）
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
