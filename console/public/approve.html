<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>审片</title>
  <link rel="stylesheet" href="/approve.css" />
</head>
<body>
  <!-- ============================================================
       审片页：手机上也能看。列表 → 详情 → 看完 → 填名字 → 通过 / 退回。
       所有状态从 /api/approve 读，页面自己不存任何东西（只记住姓名）。
       ============================================================ -->
  <header class="top">
    <a class="back" id="back" href="/approve" hidden>‹ 待审列表</a>
    <h1 id="title">审片</h1>
    <p class="sub" id="subtitle">看完再点「通过」；有问题写一句退回，Codex 会去改。</p>
  </header>

  <main id="main">
    <p class="dim" id="loading">正在读取…</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- 列表项 -->
  <template id="tpl-item">
    <a class="card item">
      <span class="badge"></span>
      <span class="item-title"></span>
      <span class="item-slug dim"></span>
    </a>
  </template>

  <!-- 终审：播放到结尾才能通过 -->
  <template id="tpl-final">
    <section class="card">
      <h2>终审 <span class="badge rev"></span></h2>
      <div class="notice bad blocker" hidden></div>
      <div class="notice ok done" hidden>这一版已经通过。</div>
      <video controls playsinline preload="metadata"></video>
      <p class="hint watch">请从头看到结尾，看完「通过」才会亮。</p>
      <form class="approve-form">
        <label class="field">姓名 <input name="name" autocomplete="name" placeholder="谁看的" required maxlength="40" /></label>
        <label class="check"><input type="checkbox" name="fullPlayback" /> 我完整看完了这条片</label>
        <button type="submit" class="accent" disabled>通过</button>
      </form>
      <details class="reject">
        <summary>有问题，退回</summary>
        <form class="reject-form">
          <textarea name="note" rows="4" placeholder="哪里不对？写一句就行，比如「第 12 秒字幕错字」"></textarea>
          <button type="submit">退回给 Codex</button>
        </form>
      </details>
    </section>
  </template>

  <!-- 切点：逐张看过切点图 -->
  <template id="tpl-cuts">
    <section class="card">
      <h2>切点 <span class="badge count"></span></h2>
      <div class="notice bad blocker" hidden></div>
      <div class="notice ok done" hidden>切点已经通过。</div>
      <p class="hint">每张图是一个切点前后的连续帧；看有没有跳帧、半句话、重复。点图会把视频跳到那个切点前一秒半播放，听气口。</p>
      <video class="cut-video" controls playsinline preload="metadata" hidden></video>
      <div class="strips"></div>
      <form class="approve-form">
        <label class="field">姓名 <input name="name" autocomplete="name" placeholder="谁看的" required maxlength="40" /></label>
        <label class="check warn-check" hidden><input type="checkbox" name="acousticReviewed" /> <span></span></label>
        <label class="check"><input type="checkbox" name="fullPlayback" /> 我完整看完了这条片</label>
        <button type="submit" class="accent" disabled>通过</button>
      </form>
    </section>
  </template>

  <script src="/approve.js"></script>
</body>
</html>
